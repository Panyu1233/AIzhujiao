# 参考示例：将宿主机目录挂载为知识库根目录，实现"不重新部署即可更新文件"。
#
# 使用方式：
#  1. 先构建镜像（或使用 CI/CD 产出的制品镜像）
#  2. 把宿主机目录 /opt/kb 映射为容器内 KNOWLEDGE_BASE_ROOT，并注入 FASTGPT_FILE_LIBRARY_TOKEN
#
# 核心：KNOWLEDGE_BASE_ROOT 指向挂载目录后，你在宿主机 /opt/kb 增删/替换文件，
# 服务端扫描器（TTL 10s 或调用 POST /api/admin/flush-cache）即可让 FastGPT 立刻读到，
# 无需重新构建或重启容器（写操作可再走 /api/admin/upload / api/admin/file）。
version: "3.9"

services:
  kb-file-service:
    # 若项目内已有 Dockerfile 则取消下面注释并指定镜像构建
    # build:
    #   context: .
    image: your-registry/kb-file-service:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # 关键：知识库根目录指向挂载点
      KNOWLEDGE_BASE_ROOT: /data/knowledge-base
      FASTGPT_FILE_LIBRARY_TOKEN: "请替换为你的真实Token"
      PORT: "5000"
      APP_ENV: "PROD"
      # 可选：PUBLIC_BASE_URL=https://your.domain
      # PUBLIC_BASE_URL: "https://your.domain"
    volumes:
      # 宿主机目录 -> 容器内知识库根（热更新，无需重新部署）
      - /opt/kb:/data/knowledge-base
    # 写入能力：当前容器以 root 运行以便对挂载目录读写；
    # 生产建议按需收紧并确保宿主目录属主同容器用户。
    user: "0:0"
